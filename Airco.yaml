blueprint:
  name: "Eenvoudige Bandbreedte Klimaatregeling (Instelbare Marges)"
  description: "Aansturing op vaste doelen (Thuis/Weg/Nacht), instelbare boven/onder marge, overshoot blokkade en multi-device aanwezigheid."
  domain: automation
  input:
    climate_entity:
      name: "Airco Unit"
      selector: { entity: { domain: climate } }
    room_sensor:
      name: "IKEA Temperatuur Sensor (Binnen)"
      selector: { entity: { domain: sensor, device_class: temperature } }
    outside_sensor:
      name: "Buiten Temperatuur Sensor"
      selector: { entity: { domain: sensor, device_class: temperature } }
    
    # --- AANWEZIGHEID ---
    presence_sensors:
      name: "Aanwezigheid (Selecteer 1 of meerdere telefoons)"
      description: "Laat leeg als je geen wegsignaal gebruikt. Selecteer je TP-link telefoons. Zodra er 1 thuis is, is de status 'Thuis'."
      default: []
      selector: 
        entity: 
          domain: [device_tracker, binary_sensor]
          multiple: true

    # --- DOELTEMPERATUREN ---
    target_home:
      name: "Doeltemperatuur Thuis"
      default: 21.0
      selector: { number: { min: 16, max: 26, step: 0.5, unit_of_measurement: "°C" } }
    target_away:
      name: "Doeltemperatuur Weg (Eco)"
      default: 18.0
      selector: { number: { min: 15, max: 25, step: 0.5, unit_of_measurement: "°C" } }
    target_night:
      name: "Doeltemperatuur Nacht"
      default: 19.0
      selector: { number: { min: 15, max: 24, step: 0.5, unit_of_measurement: "°C" } }

    # --- MARGES ---
    margin_upper:
      name: "Boven Marge (Koelen)"
      description: "Aantal graden boven het doel voordat de airco gaat koelen."
      default: 2.5
      selector: { number: { min: 0.5, max: 5.0, step: 0.5, unit_of_measurement: "°C" } }
    margin_lower:
      name: "Onder Marge (Verwarmen)"
      description: "Aantal graden onder het doel voordat de airco gaat verwarmen."
      default: 2.5
      selector: { number: { min: 0.5, max: 5.0, step: 0.5, unit_of_measurement: "°C" } }

    # --- TIJDSVAKKEN ---
    time_morning:
      name: "Start Ochtend (Schakelt airco uit en start dagritme)"
      default: "07:00:00"
      selector: { time: {} }
    time_night:
      name: "Start Nacht (Schakelt airco uit en start nachtritme)"
      default: "23:00:00"
      selector: { time: {} }

mode: restart

variables:
  room_sensor: !input room_sensor
  outside_sensor: !input outside_sensor
  presence_entities: !input presence_sensors
  climate_entity: !input climate_entity
  t_home: !input target_home
  t_away: !input target_away
  t_night: !input target_night
  m_upper: !input margin_upper
  m_lower: !input margin_lower

  room_temp: '{{ states(room_sensor) | float(21) }}'
  outside_temp: '{{ states(outside_sensor) | float(21) }}'
  
  # Bepaal of we 'thuis' of 'weg' zijn
  is_present: >
    {% if presence_entities | length == 0 %}
      True
    {% else %}
      {{ expand(presence_entities) | selectattr('state', 'in', ['home', 'on']) | list | length > 0 }}
    {% endif %}

  # Tijd logica
  current_time: '{{ now().strftime("%H:%M:%S") }}'
  morning_time: !input time_morning
  night_time: !input time_night
  is_night_time: '{{ current_time >= night_time or current_time < morning_time }}'

  # Selecteer de actieve doeltemperatuur
  active_target: >
    {% if not is_present %}
      {{ t_away }}
    {% elif is_night_time %}
      {{ t_night }}
    {% else %}
      {{ t_home }}
    {% endif %}

  # De grenzen berekenen op basis van de ingestelde marges
  lower_limit: '{{ active_target - m_lower }}'
  upper_limit: '{{ active_target + m_upper }}'

trigger:
  - platform: state
    entity_id: !input room_sensor
  - platform: state
    entity_id: !input presence_sensors
  - platform: time
    at: !input time_morning
    id: transition_off
  - platform: time
    at: !input time_night
    id: transition_off
  - platform: time_pattern
    minutes: "/15"

action:
  - choose:
      # Als de trigger de start van de ochtend of nacht is -> Direct uit schakelen
      - conditions:
          - condition: trigger
            id: transition_off
        sequence:
          - action: climate.turn_off
            target: { entity_id: !input climate_entity }

    default:
      - choose:
          # 1. Te koud ÉN het is buiten ook te koud -> Actief Verwarmen
          - conditions:
              - condition: template
                value_template: '{{ room_temp <= lower_limit and outside_temp < active_target }}'
            sequence:
              - action: climate.set_temperature
                target: { entity_id: !input climate_entity }
                data: { temperature: '{{ active_target }}', hvac_mode: heat }

          # 2. Te warm ÉN het is buiten ook te warm -> Actief Koelen
          - conditions:
              - condition: template
                value_template: '{{ room_temp >= upper_limit and outside_temp > active_target }}'
            sequence:
              - action: climate.set_temperature
                target: { entity_id: !input climate_entity }
                data: { temperature: '{{ active_target }}', hvac_mode: cool }

        # 3. Al het andere (Binnen de bandbreedte OF natuurlijke afkoeling/opwarming mogelijk) -> Uit
        default:
          - action: climate.turn_off
            target: { entity_id: !input climate_entity }
