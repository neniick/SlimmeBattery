blueprint:
  name: "Dual Setpoint Klimaatregeling (Met Herstel-doel)"
  description: "Onafhankelijke grenzen met een Recovery Target. Trekt de kamer na activatie comfortabel naar het midden en voorkomt pendelen."
  domain: automation
  input:
    climate_entity:
      name: "Airco Unit"
      selector: { entity: { domain: climate } }
    room_sensor:
      name: "IKEA Temperatuur Sensor (Binnen)"
      selector: { entity: { domain: sensor, device_class: temperature } }
    outside_sensor:
      name: "Buiten Temperatuur Sensor"
      selector: { entity: { domain: sensor, device_class: temperature } }
    
    # --- AANWEZIGHEID ---
    presence_sensors:
      name: "Aanwezigheid (Selecteer 1 of meerdere telefoons)"
      description: "Zodra minimaal 1 apparaat thuis is, telt het huis als 'Thuis'."
      default: []
      selector: 
        entity: 
          domain: [device_tracker, binary_sensor]
          multiple: true

    # --- INSTELLINGEN THUIS ---
    heat_home:
      name: "THUIS: Verwarmen als temperatuur zakt ONDER"
      default: 20.0
      selector: { number: { min: 15, max: 25, step: 0.5, unit_of_measurement: "°C" } }
    cool_home:
      name: "THUIS: Koelen als temperatuur stijgt BOVEN"
      default: 24.0
      selector: { number: { min: 20, max: 30, step: 0.5, unit_of_measurement: "°C" } }
    target_home:
      name: "THUIS: Herstel-doel (Doel van de airco)"
      description: "Waar moet de airco naartoe werken als hij eenmaal aan springt?"
      default: 21.5
      selector: { number: { min: 18, max: 26, step: 0.5, unit_of_measurement: "°C" } }

    # --- INSTELLINGEN WEG ---
    heat_away:
      name: "WEG: Verwarmen als temperatuur zakt ONDER"
      default: 15.0
      selector: { number: { min: 10, max: 20, step: 0.5, unit_of_measurement: "°C" } }
    cool_away:
      name: "WEG: Koelen als temperatuur stijgt BOVEN"
      default: 28.0
      selector: { number: { min: 24, max: 35, step: 0.5, unit_of_measurement: "°C" } }
    target_away:
      name: "WEG: Herstel-doel (Doel van de airco)"
      default: 18.0
      selector: { number: { min: 15, max: 25, step: 0.5, unit_of_measurement: "°C" } }

    # --- INSTELLINGEN NACHT ---
    heat_night:
      name: "NACHT: Verwarmen als temperatuur zakt ONDER"
      default: 16.0
      selector: { number: { min: 10, max: 20, step: 0.5, unit_of_measurement: "°C" } }
    cool_night:
      name: "NACHT: Koelen als temperatuur stijgt BOVEN"
      default: 26.0
      selector: { number: { min: 22, max: 30, step: 0.5, unit_of_measurement: "°C" } }
    target_night:
      name: "NACHT: Herstel-doel (Doel van de airco)"
      default: 19.0
      selector: { number: { min: 15, max: 24, step: 0.5, unit_of_measurement: "°C" } }

    # --- TIJDSVAKKEN ---
    time_morning:
      name: "Start Ochtend (Schakelt airco uit en start dagritme)"
      default: "07:00:00"
      selector: { time: {} }
    time_night:
      name: "Start Nacht (Schakelt airco uit en start nachtritme)"
      default: "23:00:00"
      selector: { time: {} }

mode: restart

variables:
  room_sensor: !input room_sensor
  outside_sensor: !input outside_sensor
  presence_entities: !input presence_sensors
  climate_entity: !input climate_entity
  
  # Inputs in variabelen laden
  h_home: !input heat_home
  c_home: !input cool_home
  t_home: !input target_home
  h_away: !input heat_away
  c_away: !input cool_away
  t_away: !input target_away
  h_night: !input heat_night
  c_night: !input cool_night
  t_night: !input target_night

  room_temp: '{{ states(room_sensor) | float(21) }}'
  outside_temp: '{{ states(outside_sensor) | float(21) }}'
  
  # Bepaal of we 'thuis' of 'weg' zijn
  is_present: >
    {% if presence_entities | length == 0 %}
      True
    {% else %}
      {{ expand(presence_entities) | selectattr('state', 'in', ['home', 'on']) | list | length > 0 }}
    {% endif %}

  # Tijd logica
  current_time: '{{ now().strftime("%H:%M:%S") }}'
  morning_time: !input time_morning
  night_time: !input time_night
  is_night_time: '{{ current_time >= night_time or current_time < morning_time }}'

  # Selecteer de actieve grenzen en doelen
  active_heat_limit: >
    {% if not is_present %}
      {{ h_away }}
    {% elif is_night_time %}
      {{ h_night }}
    {% else %}
      {{ h_home }}
    {% endif %}

  active_cool_limit: >
    {% if not is_present %}
      {{ c_away }}
    {% elif is_night_time %}
      {{ c_night }}
    {% else %}
      {{ c_home }}
    {% endif %}

  active_target: >
    {% if not is_present %}
      {{ t_away }}
    {% elif is_night_time %}
      {{ t_night }}
    {% else %}
      {{ t_home }}
    {% endif %}

trigger:
  - platform: state
    entity_id: !input room_sensor
  - platform: state
    entity_id: !input presence_sensors
  - platform: time
    at: !input time_morning
    id: transition_off
  - platform: time
    at: !input time_night
    id: transition_off
  - platform: time_pattern
    minutes: "/15"

action:
  - choose:
      # 1. Modus wisseling (Ochtend / Nacht start) -> Direct uit schakelen
      - conditions:
          - condition: trigger
            id: transition_off
        sequence:
          - action: climate.turn_off
            target: { entity_id: !input climate_entity }

    default:
      - choose:
          # 2. Te koud ÉN het is buiten ook koud -> Actief Verwarmen
          - conditions:
              - condition: template
                value_template: '{{ room_temp < active_heat_limit and outside_temp < active_target }}'
            sequence:
              - action: climate.set_temperature
                target: { entity_id: !input climate_entity }
                data: { temperature: '{{ active_target }}', hvac_mode: heat }

          # 3. Te warm ÉN het is buiten ook warm -> Actief Koelen
          - conditions:
              - condition: template
                value_template: '{{ room_temp > active_cool_limit and outside_temp > active_target }}'
            sequence:
              - action: climate.set_temperature
                target: { entity_id: !input climate_entity }
                data: { temperature: '{{ active_target }}', hvac_mode: cool }

          # 4. Airco is momenteel aan het Verwarmen en het Herstel-doel is bereikt -> Uit
          - conditions:
              - condition: template
                value_template: '{{ states(climate_entity) == "heat" and room_temp >= active_target }}'
            sequence:
              - action: climate.turn_off
                target: { entity_id: !input climate_entity }

          # 5. Airco is momenteel aan het Koelen en het Herstel-doel is bereikt -> Uit
          - conditions:
              - condition: template
                value_template: '{{ states(climate_entity) == "cool" and room_temp <= active_target }}'
            sequence:
              - action: climate.turn_off
                target: { entity_id: !input climate_entity }

        # Als er niets van het bovenstaande aan de hand is, doet hij niets 
        # (waardoor de airco rustig kan blijven draaien totdat doel bereikt is, of rustig uit kan blijven).
