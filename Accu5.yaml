blueprint:
  name: "Nul op de Meter - Vanaf Nul (Zonneplan Forecast, 24/7 Laden & Marge)"
  description: >
    Kogelvrije, wiskundig perfecte logica.
    - BEVEILIGING: Voorkomt directe wisseling tussen laden en ontladen (Hardware Lock).
    - BEVEILIGING: Zet bij de 'None' (Idle) status ook actief de vermogens naar 0W.
    - BEVEILIGING: Leest live de integratie-limieten uit om range-crashes te voorkomen.
    - BEVEILIGING: Blokkeert verkoop naar net bij slechte zonne-voorspelling morgen.
    - Leest het Zonneplan 'forecast'-attribuut uit met instelbare vooruitkijk-horizon.
    - Net-laden is 24/7 toegestaan zonder tijdvakbeperking.
    - Instelbare marge (€ en %) boven de laagste prijs om ruimer in te kopen.
  domain: automation
  input:
    update_interval:
      name: "Uitvoer-frequentie"
      default: "/5"
      selector:
        select:
          options:
            - label: "Elke 3 seconden (Zeer agressief)"
              value: "/3"
            - label: "Elke 5 seconden (Snel)"
              value: "/5"
            - label: "Elke 6 seconden"
              value: "/6"
            - label: "Elke 10 seconden (Stabiel - Aanbevolen)"
              value: "/10"
            - label: "Elke 15 seconden (Rustig)"
              value: "/15"
    damping_factor:
      name: "Dempingsfactor (Stabiliteit)"
      description: "0.5 = Langzaam & vloeiend naar 0. 1.0 = Direct & agressief naar 0 (kans op jojo). Aanbevolen: 0.8"
      default: 0.8
      selector:
        number:
          min: 0.5
          max: 1.0
          step: 0.05
          mode: slider
    sensor_soc:
      name: "Batterij SOC (%)"
      selector:
        entity:
          domain: sensor
    sensor_house_power:
      name: "Netverbruik P1-Meter (W)"
      selector:
        entity:
          domain: sensor
    sensor_price_value:
      name: "Zonneplan Huidige Prijs (€/kWh)"
      description: "Selecteer sensor.zonneplan_current_electricity_tariff (bevat zowel de huidige prijs als het 'forecast' attribuut)"
      selector:
        entity:
          domain: sensor
    price_lookahead_hours:
      name: "Prijs: Hoeveel uur vooruit kijken?"
      description: "Bepaalt hoeveel uur vooruit in het Zonneplan forecast-attribuut wordt gekeken voor de laagste en hoogste prijs."
      default: 10
      selector:
        number:
          min: 1
          max: 36
          step: 1
          unit_of_measurement: "uur"
    sensor_solar_remaining_today:
      name: "Forecast.Solar - Resterende productie VANDAAG (kWh)"
      selector:
        entity:
          domain: sensor
    sensor_solar_forecast_tomorrow:
      name: "Forecast.Solar - Totale productie MORGEN (kWh)"
      selector:
        entity:
          domain: sensor
    battery_capacity_kwh:
      name: "Batterij Capaciteit (kWh)"
      default: 25
      selector:
        number:
          min: 5
          max: 100
          step: 1
          unit_of_measurement: "kWh"
    threshold_good_solar:
      name: "Drempel: Zonnige dag (kWh)"
      default: 15
      selector:
        number:
          min: 5
          max: 50
          step: 1
          unit_of_measurement: "kWh"
    threshold_bad_solar:
      name: "Drempel: Slechte dag (kWh)"
      default: 7
      selector:
        number:
          min: 0
          max: 20
          step: 1
          unit_of_measurement: "kWh"
    target_soc_base:
      name: "Regel 1: Standaard Doel-SOC Zonsondergang (%)"
      default: 50
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
    target_soc_prep:
      name: "Regel 2: Doel-SOC bij slechte dag morgen (%)"
      default: 80
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
    block_sell_bad_solar:
      name: "Regel 4: Verkoop blokkeren bij slechte dag morgen"
      description: "Blokkeer verkoop aan het net (GridDischarge) zodra de voorspelling voor morgen onder de drempel 'Slechte dag' valt."
      default: true
      selector:
        boolean: {}
    trade_trigger_soc:
      name: "Regel 4: Minimum SOC om te mogen handelen (%)"
      default: 90
      selector:
        number:
          min: 50
          max: 100
          step: 5
          unit_of_measurement: "%"
    trade_bottom_soc:
      name: "Regel 4: Ontlaad-bodem tijdens handelen (%)"
      default: 50
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
    max_charge_price:
      name: "Prijs: Maximale Inkoopprijs (€/kWh)"
      default: 0.25
      selector:
        number:
          min: 0.00
          max: 0.50
          step: 0.01
          unit_of_measurement: "€"
    buy_price_margin_eur:
      name: "Inkoopmarge: Bedrag boven laagste prijs (€/kWh)"
      description: "Laad ook bij als de huidige prijs binnen dit bedrag boven de laagste prijs ligt (bijv. 0.02 = 2 cent). Zet op 0 om uit te schakelen."
      default: 0.00
      selector:
        number:
          min: 0.00
          max: 0.20
          step: 0.005
          unit_of_measurement: "€"
    buy_price_margin_pct:
      name: "Inkoopmarge: Percentage boven laagste prijs (%)"
      description: "Laad ook bij als de huidige prijs binnen dit percentage boven de laagste prijs ligt (bijv. 5 = 5%). Zet op 0 om uit te schakelen."
      default: 0
      selector:
        number:
          min: 0
          max: 50
          step: 1
          unit_of_measurement: "%"
    min_discharge_price:
      name: "Prijs: Minimale Verkoopprijs (€/kWh)"
      default: 0.35
      selector:
        number:
          min: 0.00
          max: 0.50
          step: 0.01
          unit_of_measurement: "€"
    grid_deadband_w:
      name: "Deadband Nul-op-de-meter (W)"
      default: 300
      selector:
        number:
          min: 50
          max: 1000
          step: 50
          unit_of_measurement: "W"
    power_house_charge:
      name: "Vermogen: Zon -> Accu (W)"
      default: 8000
      selector:
        number:
          min: 0
          max: 10000
          step: 100
          unit_of_measurement: "W"
    power_house_discharge:
      name: "Vermogen: Accu -> Huis (W)"
      default: 6000
      selector:
        number:
          min: 0
          max: 10000
          step: 100
          unit_of_measurement: "W"
    power_grid_charge:
      name: "Vermogen: Net -> Accu (Kopen) (W)"
      default: 4000
      selector:
        number:
          min: 0
          max: 10000
          step: 100
          unit_of_measurement: "W"
    power_grid_discharge:
      name: "Vermogen: Accu -> Net (Verkopen) (W)"
      default: 4000
      selector:
        number:
          min: 0
          max: 10000
          step: 100
          unit_of_measurement: "W"
    select_force_mode:
      name: "Solis Force Mode Selector"
      selector:
        entity:
          domain: select
    number_charge_power:
      name: "Max Charge Power Actuator"
      selector:
        entity:
          domain: number
    number_discharge_power:
      name: "Max Discharge Power Actuator"
      selector:
        entity:
          domain: number

variables:
  v_soc: !input sensor_soc
  v_grid: !input sensor_house_power
  v_price: !input sensor_price_value
  v_lookahead: !input price_lookahead_hours
  v_solar_today: !input sensor_solar_remaining_today
  v_solar_tomorrow: !input sensor_solar_forecast_tomorrow
  v_damping: !input damping_factor
  v_cap: !input battery_capacity_kwh
  v_good_solar: !input threshold_good_solar
  v_bad_solar: !input threshold_bad_solar
  v_target_base: !input target_soc_base
  v_target_prep: !input target_soc_prep
  v_block_sell: !input block_sell_bad_solar
  v_trade_trigger: !input trade_trigger_soc
  v_trade_bottom: !input trade_bottom_soc
  v_max_buy: !input max_charge_price
  v_buy_margin_eur: !input buy_price_margin_eur
  v_buy_margin_pct: !input buy_price_margin_pct
  v_min_sell: !input min_discharge_price
  v_deadband: !input grid_deadband_w
  v_pwr_hc: !input power_house_charge
  v_pwr_hd: !input power_house_discharge
  v_pwr_gc: !input power_grid_charge
  v_pwr_gd: !input power_grid_discharge
  v_sel_mode: !input select_force_mode
  v_num_c: !input number_charge_power
  v_num_d: !input number_discharge_power

trigger:
  - platform: time_pattern
    seconds: !input update_interval

action:
  - variables:
      soc: "{{ states(v_soc) | float(0.0) }}"
      grid_w: "{{ states(v_grid) | float(0.0) }}"
      price: "{{ states(v_price) | float(99.0) }}"
      cur_c: "{{ states(v_num_c) | float(0.0) if states(v_sel_mode) == 'Solis RC Force Battery Charge' else 0.0 }}"
      cur_d: "{{ states(v_num_d) | float(0.0) if states(v_sel_mode) == 'Solis RC Force Battery Discharge' else 0.0 }}"
      real_demand: "{{ grid_w + cur_d - cur_c }}"
      hour: "{{ now().hour | int(0) }}"
      raw_today: "{{ states(v_solar_today) | float(0.0) }}"
      raw_tomorrow: "{{ states(v_solar_tomorrow) | float(0.0) }}"
      solar_today: "{{ raw_tomorrow if (hour < 5 and raw_today < 0.1) else raw_today }}"
      solar_tomorrow: "{{ raw_tomorrow }}"
      is_sunny_today: "{{ solar_today >= (v_good_solar | float(15.0)) }}"
      is_bad_tomorrow: "{{ solar_tomorrow <= (v_bad_solar | float(7.0)) }}"
      active_target_soc: >-
        {% if is_bad_tomorrow | bool(false) %}
          {{ v_target_prep | float(80.0) }}
        {% else %}
          {{ v_target_base | float(50.0) }}
        {% endif %}
      current_kwh: "{{ (soc / 100.0) * (v_cap | float(25.0)) }}"
      target_kwh: "{{ ((active_target_soc | float(50.0)) / 100.0) * (v_cap | float(25.0)) }}"
      safe_solar: "{{ solar_today * 0.8 }}"
      shortfall_kwh: "{{ [(target_kwh - (current_kwh + safe_solar)), 0.0] | max }}"
      needs_charge: "{{ (shortfall_kwh | float(0.0)) > 0.5 }}"
      lookahead: "{{ v_lookahead | int(10) }}"
      min_buy_price: >-
        {% set ns = namespace(p=[]) %}
        {% if price < 90.0 %}
          {% set ns.p = ns.p + [price] %}
        {% endif %}
        {% set l = v_lookahead | int(10) %}
        {% set now_hour = now().replace(minute=0, second=0, microsecond=0) %}
        {% set max_dt = now_hour + timedelta(hours=l) %}
        {% set forecast_list = state_attr(v_price, 'forecast') %}
        {% if forecast_list is iterable and forecast_list is not string and forecast_list is not mapping %}
          {% for item in forecast_list %}
            {% if item is mapping %}
              {% set raw_ts = item.get('datetime') or item.get('start') or item.get('timestamp') %}
              {% set raw_val = item.get('price') if item.get('price') is not none else item.get('electricity_price') %}
              {% set dt = raw_ts | as_datetime(none) %}
              {% if dt is not none and raw_val is not none %}
                {% set dt_local = dt | as_local %}
                {% if dt_local >= now_hour and dt_local < max_dt %}
                  {% set ns.p = ns.p + [raw_val | float(99.0)] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.p | min if ns.p | length > 0 else 99.0 }}
      allowed_buy_margin: >-
        {% set min_p = min_buy_price | float(99.0) %}
        {% set m_eur = v_buy_margin_eur | float(0.0) %}
        {% set m_pct = (min_p | abs) * ((v_buy_margin_pct | float(0.0)) / 100.0) %}
        {{ [m_eur, m_pct] | max + 0.0001 }}
      is_cheapest_buy_hour: >-
        {{ price < 90.0
           and price <= ((min_buy_price | float(99.0)) + (allowed_buy_margin | float(0.0001))) }}
      max_sell_price: >-
        {% set ns = namespace(p=[price] if price < 90.0 else []) %}
        {% set l = v_lookahead | int(10) %}
        {% set now_hour = now().replace(minute=0, second=0, microsecond=0) %}
        {% set max_dt = now_hour + timedelta(hours=l) %}
        {% set forecast_list = state_attr(v_price, 'forecast') %}
        {% if forecast_list is iterable and forecast_list is not string and forecast_list is not mapping %}
          {% for item in forecast_list %}
            {% if item is mapping %}
              {% set raw_ts = item.get('datetime') or item.get('start') or item.get('timestamp') %}
              {% set raw_val = item.get('price') if item.get('price') is not none else item.get('electricity_price') %}
              {% set dt = raw_ts | as_datetime(none) %}
              {% if dt is not none and raw_val is not none %}
                {% set dt_local = dt | as_local %}
                {% if dt_local >= now_hour and dt_local < max_dt %}
                  {% set ns.p = ns.p + [raw_val | float(0.0)] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.p | max if ns.p | length > 0 else 0.0 }}
      is_most_expensive_hour: "{{ price < 90.0 and price >= ((max_sell_price | float(0.0)) - 0.0001) }}"
      should_buy_grid: >-
        {{ needs_charge | bool(false)
           and is_cheapest_buy_hour | bool(false)
           and price <= (v_max_buy | float(0.25)) }}
      dynamic_trade_bottom: "{{ [v_trade_bottom | float(50.0), active_target_soc | float(50.0)] | max }}"
      should_sell_grid: >-
        {{ not (v_block_sell | bool(true) and is_bad_tomorrow | bool(false))
           and soc >= (v_trade_trigger | float(90.0))
           and is_most_expensive_hour | bool(false)
           and price >= (v_min_sell | float(0.35))
           and soc > (dynamic_trade_bottom | float(50.0)) }}

  - variables:
      safe_deadband: "{{ v_deadband | float(300.0) }}"
      hw_max_c: "{{ state_attr(v_num_c, 'max') | float(10000.0) }}"
      hw_max_d: "{{ state_attr(v_num_d, 'max') | float(10000.0) }}"
      target_mode: >-
        {% if should_buy_grid | bool(false) %}GridCharge
        {% elif should_sell_grid | bool(false) %}GridDischarge
        {% elif real_demand > safe_deadband and soc > 8.0 %}HouseDischarge
        {% elif real_demand < (0.0 - safe_deadband) and soc < 100.0 %}HouseCharge
        {% else %}Idle{% endif %}
      raw_target_power: >-
        {% set p = 0.0 %}
        {% if target_mode == 'GridCharge' %}
          {% set p = v_pwr_gc | float(4000.0) %}
        {% elif target_mode == 'GridDischarge' %}
          {% set p = v_pwr_gd | float(4000.0) %}
        {% elif target_mode == 'HouseDischarge' %}
          {% set raw_new = (cur_d - cur_c) + (grid_w * (v_damping | float(0.8))) %}
          {% set pwr = [raw_new | round(0) | float(0.0), 0.0] | max %}
          {% set p = [pwr, (v_pwr_hd | float(6000.0))] | min %}
        {% elif target_mode == 'HouseCharge' %}
          {% set raw_new = (cur_d - cur_c) + (grid_w * (v_damping | float(0.8))) %}
          {% set pwr = [(raw_new * -1) | round(0) | float(0.0), 0.0] | max %}
          {% set p = [pwr, (v_pwr_hc | float(8000.0))] | min %}
        {% endif %}
        {{ p }}
      target_power: >-
        {% if 'Discharge' in target_mode %}
          {{ [raw_target_power | float(0.0), hw_max_d | float(10000.0)] | min }}
        {% elif 'Charge' in target_mode %}
          {{ [raw_target_power | float(0.0), hw_max_c | float(10000.0)] | min }}
        {% else %}
          0.0
        {% endif %}
      cur_simple: >-
        {% set s = states(v_sel_mode) | string %}
        {% if 'Discharge' in s %}Discharge
        {% elif 'Charge' in s %}Charge
        {% else %}Idle{% endif %}
      tgt_simple: >-
        {% set t = target_mode | string %}
        {% if 'Discharge' in t %}Discharge
        {% elif 'Charge' in t %}Charge
        {% else %}Idle{% endif %}
      transition_lock: >-
        {{ 'true' if (cur_simple == 'Charge' and tgt_simple == 'Discharge') or (cur_simple == 'Discharge' and tgt_simple == 'Charge') else 'false' }}
      exec_mode: >-
        {% if transition_lock == 'true' %}Idle
        {% else %}{{ tgt_simple }}{% endif %}

  - service: system_log.write
    data:
      level: info
      message: >
        [Nul-op-de-meter V2] Uur={{ hour }}. Mode={{ target_mode }}, Power={{ target_power }}W (MinBuy={{ min_buy_price }}, Huidig={{ price }}).
        Lock Active: {{ 'YES' if transition_lock == 'true' else 'NO' }}.

  - choose:
      - conditions: "{{ exec_mode == 'Charge' }}"
        sequence:
          - service: number.set_value
            target:
              entity_id: !input number_charge_power
            data:
              value: "{{ target_power | float(0.0) }}"
          - delay: "00:00:01"
          - service: select.select_option
            target:
              entity_id: !input select_force_mode
            data:
              option: "Solis RC Force Battery Charge"
      - conditions: "{{ exec_mode == 'Discharge' }}"
        sequence:
          - service: number.set_value
            target:
              entity_id: !input number_discharge_power
            data:
              value: "{{ target_power | float(0.0) }}"
          - delay: "00:00:01"
          - service: select.select_option
            target:
              entity_id: !input select_force_mode
            data:
              option: "Solis RC Force Battery Discharge"
    default:
      - service: number.set_value
        target:
          entity_id: !input number_charge_power
        data:
          value: 0.0
      - service: number.set_value
        target:
          entity_id: !input number_discharge_power
        data:
          value: 0.0
      - delay: "00:00:01"
      - service: select.select_option
        target:
          entity_id: !input select_force_mode
        data:
          option: "None"

mode: single
